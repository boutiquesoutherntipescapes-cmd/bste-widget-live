name: Guest automation tests

on:
  push:
    branches:
      - bste-booking-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/guest-message-renderer.test.js tests/beds24-messaging.test.js tests/guest-communications-dispatch.test.js tests/guest-communications-service.test.js tests/guest-communications-worker.test.js tests/guest-communications-live.test.js
