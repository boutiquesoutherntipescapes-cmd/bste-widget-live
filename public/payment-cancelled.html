<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSTE · Payment Cancelled</title>
<style>
:root{--ink:#182431;--muted:#687282;--paper:#fffdf9;--sand:#f4eee6;--line:#e6ddd2}
*{box-sizing:border-box}body{margin:0;background:#f6f1ea;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(720px,calc(100% - 30px));margin:70px auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:38px;box-shadow:0 24px 70px rgba(34,30,25,.09)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#a87d4c;font-weight:800}h1{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:9px 0 14px}
p{color:var(--muted);line-height:1.65}.status{margin-top:22px;padding:16px;border-radius:14px;background:var(--sand)}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="eyebrow">Boutique Southern Tip Escapes</div>
<h1 id="title">Payment cancelled</h1>
<p id="message">No payment has been taken. We are releasing the temporary hold on your dates.</p>
<div id="status" class="status">Releasing reservation hold…</div>
</section></main>
<script>
const qs=new URLSearchParams(location.search);
const payload={
  booking_id:qs.get('booking_id')||'',
  property:qs.get('property')||'',
  arrival:qs.get('arrival')||'',
  departure:qs.get('departure')||'',
  reference:qs.get('reference')||'',
  state:qs.get('state')||''
};
(async()=>{
  const status=document.getElementById('status');
  try{
    const r=await fetch('/api/payfast?action=cancel',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||'Could not release hold');
    if(data.already_confirmed){
      document.getElementById('title').textContent='Your reservation is already confirmed';
      document.getElementById('message').textContent='A successful payment was already verified, so your reservation remains secured.';
      status.textContent='Reservation confirmed.';
      return;
    }
    status.textContent='Temporary reservation hold released.';
  }catch(e){
    status.textContent='We could not automatically release the hold. BSTE will review it shortly. '+String(e.message||e);
  }
})();
</script>
</body></html>
