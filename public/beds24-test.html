<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BSTE · Beds24 Preview Test</title>
  <style>
    :root { --ink:#172231; --muted:#667085; --line:#e8e1d8; --paper:#fffdf9; --ok:#176b3a; --bad:#a51d1d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f7f3ed; color:var(--ink); }
    .wrap { width:min(760px,calc(100% - 32px)); margin:48px auto; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:32px; box-shadow:0 14px 40px rgba(42,34,24,.06); }
    h1 { margin:0 0 8px; font-family:Georgia,serif; font-size:34px; }
    p { color:var(--muted); line-height:1.6; }
    button { border:0; border-radius:999px; padding:13px 20px; font-weight:800; cursor:pointer; background:#172231; color:white; margin-right:10px; margin-top:10px; }
    button.secondary { background:#ece6de; color:#172231; }
    .status { margin-top:24px; padding:18px; border-radius:16px; background:#f1eee9; white-space:pre-wrap; line-height:1.55; }
    .ok { color:var(--ok); font-weight:800; }
    .bad { color:var(--bad); font-weight:800; }
    code { font-size:12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>BSTE Beds24 Preview Test</h1>
      <p>This page tests the new Beds24 connection without using the live owner dashboard. It only works on a Vercel Preview deployment.</p>
      <button id="check">1. Check connection</button>
      <button id="write" class="secondary">2. Run safe read/write test</button>
      <div id="status" class="status">Ready.</div>
    </section>
  </main>
<script>
const out = document.getElementById('status');
function show(msg, ok) {
  out.innerHTML = '<div class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ ' : '⚠ ') + msg + '</div>';
}
async function run(method) {
  out.textContent = 'Running test…';
  try {
    const r = await fetch('/api/beds24-health', { method });
    const data = await r.json();
    if (!r.ok || !data.ok) {
      show((data.error || 'Test failed') + (data.detail ? '\n\n' + data.detail : ''), false);
      return;
    }
    show(data.message + '\n\n' + JSON.stringify(data, null, 2), true);
  } catch (err) {
    show(String(err), false);
  }
}
document.getElementById('check').onclick = () => run('GET');
document.getElementById('write').onclick = () => {
  if (confirm('Run the safe Beds24 write test? It finds an available Legacy night, applies a temporary Beds24 blackout, and removes it again immediately.')) run('POST');
};
</script>
</body>
</html>
