<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BSTE checkout preparation</title><script src="/direct-checkout.js" defer></script></head><body>
<h1>BSTE sandbox checkout preparation</h1><p>No payment. Dates are not reserved. Final inventory protection comes later.</p>
<form id="quote-form" method="post"><label>Property <select id="property"><option value="legacy-suiderstrand">Legacy Beach Villa</option><option value="kalay-ridge-villa-struisbaai">Kalaya Ridge Villa</option><option value="the-pearl-beach-villa-agulhas">The Pearl Beach Villa</option></select></label>
<label>Arrival <input id="arrival" type="date" required></label><label>Departure <input id="departure" type="date" required></label><label>Adults <input id="adults" type="number" min="1" value="2" required></label><label>Children <input id="children" type="number" min="0" value="0" required></label><button>Get server quote</button></form>
<pre id="quote"></pre><form id="guest-form" method="post" hidden><label>First name <input id="first-name" maxlength="100" required></label><label>Surname <input id="surname" maxlength="100" required></label><label>Email <input id="email" type="email" maxlength="254" required></label><label>Mobile <input id="mobile" type="tel" maxlength="30" required></label><p><a id="terms" target="_blank" rel="noopener noreferrer">Read rental terms</a></p><label><input id="accepted" type="checkbox" required>I accept these rental terms.</label><button id="prepare">Prepare checkout — no payment</button></form>
<p id="status" role="status"></p></body></html>
