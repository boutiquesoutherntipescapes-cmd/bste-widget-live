<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSTE · Payment Status</title>
<style>
:root{--ink:#182431;--muted:#687282;--paper:#fffdf9;--sand:#f4eee6;--line:#e6ddd2;--ok:#176b3a;--warn:#9a6a24}
*{box-sizing:border-box}body{margin:0;background:#f6f1ea;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(720px,calc(100% - 30px));margin:70px auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:38px;box-shadow:0 24px 70px rgba(34,30,25,.09)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#a87d4c;font-weight:800}h1{font-family:Georgia,serif;font-size:40px;line-height:1.05;margin:9px 0 14px}
p{color:var(--muted);line-height:1.65}.status{margin-top:22px;padding:16px;border-radius:14px;background:var(--sand)}.ok{color:var(--ok);font-weight:800}.warn{color:var(--warn);font-weight:800}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="eyebrow">Boutique Southern Tip Escapes</div>
<h1 id="title">Confirming your payment…</h1>
<p id="message">Please keep this page open for a moment while we confirm the payment with PayFast and secure your reservation.</p>
<div id="status" class="status">Checking reservation status…</div>
</section></main>
<script>
const qs=new URLSearchParams(location.search);
const params={
  booking_id:qs.get('booking_id')||'',
  property:qs.get('property')||'',
  arrival:qs.get('arrival')||'',
  departure:qs.get('departure')||'',
  reference:qs.get('reference')||'',
  state:qs.get('state')||''
};
const statusEl=document.getElementById('status');
const title=document.getElementById('title');
const message=document.getElementById('message');

async function check(){
  const r=await fetch('/api/payfast-status?'+new URLSearchParams(params));
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'Could not check status');

  if(data.confirmed){
    title.textContent='Your reservation is confirmed';
    message.textContent='Thank you. Your payment has been verified and your BSTE reservation is secured. A confirmation will follow from our team.';
    statusEl.innerHTML='<span class="ok">✓ Payment verified · Booking '+data.booking_id+'</span>';
    return true;
  }
  if(data.cancelled){
    title.textContent='This reservation is not confirmed';
    message.textContent='The payment was not completed and the temporary reservation hold has been released.';
    statusEl.textContent='Payment not completed.';
    return true;
  }
  statusEl.innerHTML='<span class="warn">Payment received by PayFast may still be processing. Please do not pay again.</span>';
  return false;
}

(async()=>{
  for(let i=0;i<15;i++){
    try{ if(await check()) return; }catch(e){ statusEl.textContent=String(e.message||e); }
    await new Promise(r=>setTimeout(r,2000));
  }
  title.textContent='We are confirming your reservation';
  message.textContent='Your payment submission is being checked. Please do not make a second payment. Boutique Southern Tip Escapes will confirm the reservation shortly.';
})();
</script>
</body></html>
